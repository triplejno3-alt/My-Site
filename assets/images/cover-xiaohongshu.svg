<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" style="background: transparent;">
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e0"/>
      <stop offset="40%" stop-color="#ede3c8"/>
      <stop offset="100%" stop-color="#e4d6b5"/>
    </linearGradient>
    <linearGradient id="cover-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="50%" stop-color="#7d5535"/>
      <stop offset="100%" stop-color="#8b6514"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3a1e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#5c3a1e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5c3a1e" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#5c3a1e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5c3a1e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1080" height="1440" fill="url(#cover-bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="900" cy="200" r="300" fill="#6b4226" opacity="0.03"/>
  <circle cx="200" cy="1200" r="250" fill="#8b6514" opacity="0.03"/>
  <circle cx="600" cy="700" r="400" fill="#5c3a1e" opacity="0.02"/>

  <!-- Decorative gradient line -->
  <rect x="200" y="380" width="680" height="4" rx="2" fill="url(#gold-line)"/>

  <!-- Main title -->
  <text x="540" y="300" text-anchor="middle" font-size="64" font-weight="800" fill="#3c2415" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" filter="url(#glow-text)" letter-spacing="4">
    我的书影音
  </text>
  <text x="540" y="380" text-anchor="middle" font-size="56" font-weight="700" fill="url(#cover-accent)" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" letter-spacing="6">
    摘录卡片集
  </text>

  <!-- Subtitle -->
  <text x="540" y="470" text-anchor="middle" font-size="24" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" letter-spacing="3">
    用 SVG 把喜欢的句子做成卡片
  </text>

  <!-- Preview cards row -->
  <rect x="80" y="550" width="260" height="340" rx="16" fill="#fdf8ef" stroke="#6b4226" stroke-width="2" opacity="0.8"/>
  <text x="210" y="590" text-anchor="middle" font-size="18" fill="#6b4226" font-family="Georgia, serif" font-weight="600">"</text>
  <text x="100" y="620" font-size="12" fill="#5c3a1e" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="100" dy="0" fill="#5c3a1e">在我一生的黄金时代，</tspan>
    <tspan x="100" dy="26">我有好多奢望。</tspan>
    <tspan x="100" dy="26" fill="#8b7355">我想爱、想吃，还想</tspan>
    <tspan x="100" dy="26" fill="#8b7355">在一瞬间变成天上</tspan>
    <tspan x="100" dy="26" fill="#8b7355">半明半暗的云。</tspan>
  </text>
  <text x="100" y="850" font-size="11" fill="#6b4226" font-family="'Noto Serif CJK SC', serif">王小波《黄金时代》</text>

  <rect x="410" y="550" width="260" height="340" rx="16" fill="#fdf8ef" stroke="#7d5535" stroke-width="2" opacity="0.8"/>
  <text x="540" y="590" text-anchor="middle" font-size="18" fill="#7d5535" font-family="Georgia, serif" font-weight="600">❝</text>
  <text x="430" y="620" font-size="12" fill="#5c3a1e" font-family="'Playfair Display', 'Noto Serif CJK SC', serif">
    <tspan x="430" dy="0">Happiness only real</tspan>
    <tspan x="430" dy="22" fill="#8b7355">when shared.</tspan>
  </text>
  <text x="430" y="680" font-size="12" fill="#5c3a1e" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="430" dy="0">快乐只有在分享时，</tspan>
    <tspan x="430" dy="26">才是真实的。</tspan>
  </text>
  <text x="430" y="850" font-size="11" fill="#7d5535" font-family="'Noto Serif CJK SC', serif">《荒野生存》</text>

  <rect x="740" y="550" width="260" height="340" rx="16" fill="#fdf8ef" stroke="#8b6514" stroke-width="2" opacity="0.8"/>
  <text x="870" y="590" text-anchor="middle" font-size="18" fill="#8b6514" font-family="Georgia, serif" font-weight="600">"</text>
  <text x="760" y="620" font-size="12" fill="#5c3a1e" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="760" dy="0">如果你想制造牵挂，</tspan>
    <tspan x="760" dy="26">就要承担流泪的风险。</tspan>
  </text>
  <text x="760" y="690" font-size="12" fill="#5c3a1e" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="760" dy="0">正是你为玫瑰付出的</tspan>
    <tspan x="760" dy="26">时间，使你的玫瑰</tspan>
    <tspan x="760" dy="26">如此重要。</tspan>
  </text>
  <text x="760" y="850" font-size="11" fill="#8b6514" font-family="'Noto Serif CJK SC', serif">《小王子》</text>

  <!-- Bottom info bar -->
  <rect x="0" y="1330" width="1080" height="110" fill="#e8dcc5" opacity="0.6"/>
  <text x="540" y="1375" text-anchor="middle" font-size="20" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" font-weight="700" letter-spacing="2">✦ 6 张卡片 · 6 种风格 · 全部用 SVG 手写</text>
  <text x="540" y="1410" text-anchor="middle" font-size="15" fill="#8b6514" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">作者：小黑 ·  Way 的 AI 助手</text>
</svg>
