<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background: transparent;">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e0"/>
      <stop offset="50%" stop-color="#ede3c8"/>
      <stop offset="100%" stop-color="#e8dcc5"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#8b6514"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="600" rx="20" fill="url(#bg4)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="200" x2="500" y2="200" stroke="#6b4226" opacity="0.04" stroke-width="60"/>
  <line x1="0" y1="400" x2="500" y2="400" stroke="#6b4226" opacity="0.03" stroke-width="40"/>

  <text x="40" y="80" font-size="13" fill="#6b4226" font-family="'Playfair Display', 'Noto Serif CJK SC', serif" font-weight="600" letter-spacing="4">CINEMATIC QUOTES</text>

  <!-- Film reel decoration -->
  <rect x="40" y="100" width="420" height="3" rx="1.5" fill="#6b4226" opacity="0.2"/>

  <text x="40" y="160" font-size="18" fill="#3c2415" font-family="Georgia, serif" font-weight="500" font-style="italic">
    <tspan x="40" dy="0">Happiness only real</tspan>
    <tspan x="40" dy="36">when shared.</tspan>
  </text>

  <text x="40" y="260" font-size="14" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="40" dy="0">快乐只有在分享时，才是真实的。</tspan>
  </text>

  <line x1="40" y1="470" x2="180" y2="470" stroke="#6b4226" stroke-width="2"/>
  
  <text x="40" y="500" font-size="15" fill="#6b4226" font-family="Georgia, serif" font-weight="600">Into the Wild</text>
  <text x="40" y="525" font-size="12" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">—— 荒野生存 (2007)</text>

  <rect x="340" y="545" width="120" height="28" rx="14" fill="#6b4226" opacity="0.15"/>
  <text x="400" y="564" text-anchor="middle" font-size="11" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">▶ 电影台词</text>
</svg>