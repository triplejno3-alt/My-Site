<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background: transparent;">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f1e0"/>
      <stop offset="50%" stop-color="#ede3c8"/>
      <stop offset="100%" stop-color="#e8dcc5"/>
    </linearGradient>
    <linearGradient id="accent6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#8b6514"/>
    </linearGradient>
    <filter id="text-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="500" height="600" rx="20" fill="url(#bg6)"/>

  <!-- Boxing ring rope effect -->
  <line x1="0" y1="180" x2="500" y2="180" stroke="#6b4226" opacity="0.04" stroke-width="80"/>
  
  <text x="30" y="70" font-size="12" fill="#6b4226" font-family="'Playfair Display', 'Noto Serif CJK SC', serif" font-weight="700" letter-spacing="5" opacity="0.6">ROCKY BALBOA</text>

  <text x="40" y="130" font-size="16" fill="#3c2415" font-family="'Playfair Display', 'Noto Serif CJK SC', serif" font-weight="400" filter="url(#text-shadow)">
    <tspan x="40" dy="0">The world ain't all sunshine</tspan>
    <tspan x="40" dy="28">and rainbows. It's a very mean</tspan>
    <tspan x="40" dy="28">and nasty place...</tspan>
  </text>

  <text x="40" y="250" font-size="13" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="40" dy="0">重要的不是你能打出多重的一拳，</tspan>
    <tspan x="40" dy="28">而是你能承受多重的打击，</tspan>
    <tspan x="40" dy="28">然后继续往前走。</tspan>
  </text>

  <line x1="40" y1="430" x2="180" y2="430" stroke="url(#accent6)" stroke-width="2"/>
  
  <text x="40" y="460" font-size="15" fill="#6b4226" font-family="Georgia, serif" font-weight="600" filter="url(#text-shadow)">Rocky Balboa</text>
  <text x="40" y="485" font-size="12" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">—— 洛奇 (2006)</text>

  <rect x="330" y="545" width="130" height="28" rx="14" fill="#6b4226" opacity="0.15"/>
  <text x="395" y="564" text-anchor="middle" font-size="11" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">▶ 电影台词</text>
</svg>