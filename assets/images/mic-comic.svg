<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" style="background: #fffdf7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title frame -->
  <rect x="0" y="0" width="600" height="800" fill="#fffdf7"/>
  <text x="300" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#1e293b">🎬 小白的麦克风历险记</text>
  <text x="300" y="62" text-anchor="middle" font-size="13" fill="#64748b">一个真实的故事 · 知识漫画</text>

  <!-- Panel 1 -->
  <rect x="20" y="80" width="560" height="150" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="80" width="30" height="150" rx="12" fill="#f43f5e"/>
  <rect x="38" y="80" width="12" height="150" fill="#f43f5e"/>
  <text x="35" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="white" transform="rotate(-90,35,160)">1/4</text>
  <text x="65" y="112" font-size="15" font-weight="700" fill="#be123c">"买最贵的，总不会错吧？"</text>
  <text x="65" y="138" font-size="12" fill="#475569">小白看到主播用 Neumann U87 录歌，声音超好听。</text>
  <text x="65" y="158" font-size="12" fill="#475569">咬咬牙，下单了同款——结果在家里录出来全是</text>
  <text x="65" y="178" font-size="12" fill="#475569">空调声、键盘声、楼下装修声...</text>
  <text x="65" y="202" font-size="12" font-weight="600" fill="#f43f5e">💡 坑1：贵≠适合。电容麦在嘈杂环境是灾难。</text>

  <!-- Panel 2 -->
  <rect x="20" y="250" width="560" height="150" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="250" width="30" height="150" rx="12" fill="#f59e0b"/>
  <rect x="38" y="250" width="12" height="150" fill="#f59e0b"/>
  <text x="35" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="white" transform="rotate(-90,35,330)">2/4</text>
  <text x="65" y="282" font-size="15" font-weight="700" fill="#b45309">"那我买动圈麦就能解决？"</text>
  <text x="65" y="308" font-size="12" fill="#475569">朋友借给他一支 Shure SM58（动圈经典款）。</text>
  <text x="65" y="328" font-size="12" fill="#475569">噪音确实少了，但录出来总觉得声音"闷闷的"，</text>
  <text x="65" y="348" font-size="12" fill="#475569">高音细节全没了——唱歌像被被子捂着嘴。</text>
  <text x="65" y="372" font-size="12" font-weight="600" fill="#b45309">💡 动圈抗噪强，但声音细节不如电容丰富。</text>

  <!-- Panel 3 -->
  <rect x="20" y="420" width="560" height="150" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="420" width="30" height="150" rx="12" fill="#3b82f6"/>
  <rect x="38" y="420" width="12" height="150" fill="#3b82f6"/>
  <text x="35" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="white" transform="rotate(-90,35,500)">3/4</text>
  <text x="65" y="452" font-size="15" font-weight="700" fill="#1e40af">算法工程师朋友给出了真相</text>
  <text x="65" y="478" font-size="12" fill="#475569">"你先看环境——吵用动圈，静用电容。</text>
  <text x="65" y="498" font-size="12" fill="#475569">再看内容——录人声动圈够用，乐器/播客选电容。</text>
  <text x="65" y="518" font-size="12" fill="#475569">最后看接口——新手无脑选USB，省心。"</text>
  <text x="65" y="542" font-size="12" font-weight="600" fill="#3b82f6">💡 三步法：环境 → 内容 → 接口，顺序不能乱。</text>

  <!-- Panel 4 -->
  <rect x="20" y="590" width="560" height="150" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="590" width="30" height="150" rx="12" fill="#16a34a"/>
  <rect x="38" y="590" width="12" height="150" fill="#16a34a"/>
  <text x="35" y="670" text-anchor="middle" font-size="12" font-weight="700" fill="white" transform="rotate(-90,35,670)">4/4</text>
  <text x="65" y="622" font-size="15" font-weight="700" fill="#166534">最终方案：家用 USB 电容 + 防喷罩</text>
  <text x="65" y="648" font-size="12" fill="#475569">小白在安静的书房里，用 Rode NT-USB Mini 录音，</text>
  <text x="65" y="668" font-size="12" fill="#475569">搭配一个几十块的防喷罩，保持10~15cm距离。</text>
  <text x="65" y="688" font-size="12" fill="#475569">录出来的声音——终于跟主播相差不远了！</text>
  <text x="65" y="718" font-size="14" font-weight="700" fill="#166534">🎯 花最合适的钱，买到最对的声音 👍</text>

  <!-- Bottom -->
  <text x="300" y="780" text-anchor="middle" font-size="10" fill="#94a3b8">© 2026 Way · 音频算法工程师</text>
</svg>
