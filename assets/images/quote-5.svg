<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background: transparent;">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e0"/>
      <stop offset="50%" stop-color="#ede3c8"/>
      <stop offset="100%" stop-color="#e8dcc5"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3a1e"/>
      <stop offset="100%" stop-color="#8b6514"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="500" height="600" rx="20" fill="url(#bg5)"/>

  <!-- Border accent -->
  <rect x="0" y="0" width="500" height="600" rx="20" fill="none" stroke="#5c3a1e" stroke-width="1" opacity="0.08"/>

  <text x="40" y="90" font-size="72" font-weight="700" fill="#6b4226" opacity="0.08" font-family="Georgia, serif">"</text>

  <text x="40" y="120" font-size="17" fill="#3c2415" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" font-weight="400" letter-spacing="0.3">
    <tspan x="40" dy="0">关山难越，谁悲失路之人；</tspan>
    <tspan x="40" dy="36">萍水相逢，尽是他乡之客。</tspan>
  </text>

  <!-- Pinyin/annotation line -->
  <text x="40" y="220" font-size="12" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">
    <tspan x="40" dy="0">guān shān nán yuè, shuí bēi shī lù zhī rén</tspan>
  </text>

  <line x1="40" y1="470" x2="180" y2="470" stroke="#5c3a1e" stroke-width="2"/>
  
  <text x="40" y="500" font-size="15" fill="#5c3a1e" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" font-weight="600">王勃</text>
  <text x="40" y="525" font-size="12" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">——《滕王阁序》</text>

  <rect x="330" y="545" width="130" height="28" rx="14" fill="#6b4226" opacity="0.15"/>
  <text x="395" y="564" text-anchor="middle" font-size="11" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">✦ 古文名篇</text>
</svg>