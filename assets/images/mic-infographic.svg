<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" style="background: #faf8f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3451b2"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="600" height="110" fill="url(#header-grad)"/>
  <text x="300" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="white">🎤 麦克风选购指南</text>
  <text x="300" y="78" text-anchor="middle" font-size="14" fill="#c7d2fe">一张图搞懂麦克风怎么选</text>
  <text x="300" y="98" text-anchor="middle" font-size="11" fill="#93a3d8">音频算法工程师的真心话</text>

  <!-- Section 1: 两大类 -->
  <text x="30" y="148" font-size="18" font-weight="700" fill="#1e293b"> 两大类麦克风</text>

  <!-- 动圈 -->
  <rect x="30" y="165" width="260" height="120" rx="12" fill="white" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="165" width="260" height="35" rx="12" fill="#fef2f2"/>
  <rect x="30" y="188" width="260" height="12" fill="#fef2f2"/>
  <text x="160" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">🎙️ 动圈麦克风</text>
  <text x="45" y="215" font-size="11" fill="#475569">✅ 抗噪强——录不到环境噪音</text>
  <text x="45" y="235" font-size="11" fill="#475569">✅ 皮实耐用——摔几下也不坏</text>
  <text x="45" y="255" font-size="11" fill="#475569">❌ 细节少——高频有损失</text>
  <text x="45" y="278" font-size="10" fill="#94a3b8" font-style="italic">代表：Shure SM58</text>

  <!-- 电容 -->
  <rect x="310" y="165" width="260" height="120" rx="12" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="310" y="165" width="260" height="35" rx="12" fill="#eff6ff"/>
  <rect x="310" y="188" width="260" height="12" fill="#eff6ff"/>
  <text x="440" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">🎤 电容麦克风</text>
  <text x="325" y="215" font-size="11" fill="#475569">✅ 细节丰富——能录到呼吸声</text>
  <text x="325" y="235" font-size="11" fill="#475569">✅ 频响宽——高音清低音饱</text>
  <text x="325" y="255" font-size="11" fill="#475569">❌ 怕噪音——空调声都能收</text>
  <text x="325" y="278" font-size="10" fill="#94a3b8" font-style="italic">代表：Rode NT1-A</text>

  <!-- Section 2: 场景对比表格 -->
  <text x="30" y="318" font-size="18" font-weight="700" fill="#1e293b"> 场景对比</text>

  <rect x="30" y="335" width="540" height="130" rx="10" fill="white" filter="url(#shadow)"/>

  <!-- Table header -->
  <rect x="30" y="335" width="540" height="30" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="355" width="540" height="10" fill="#f1f5f9"/>
  <text x="100" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">场景</text>
  <line x1="220" y1="335" x2="220" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">动圈</text>
  <line x1="380" y1="335" x2="380" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">电容</text>
  <line x1="500" y1="335" x2="500" y2="465" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="100" y="382" text-anchor="middle" font-size="11" fill="#475569">嘈杂环境</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#16a34a">✅ 首选</text>
  <text x="440" y="382" text-anchor="middle" font-size="11" fill="#dc2626">❌ 别选</text>
  <line x1="30" y1="395" x2="570" y2="395" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="100" y="412" text-anchor="middle" font-size="11" fill="#475569">安静播客</text>
  <text x="300" y="412" text-anchor="middle" font-size="11" fill="#ca8a04">可用</text>
  <text x="440" y="412" text-anchor="middle" font-size="11" fill="#16a34a">✅ 更佳</text>
  <line x1="30" y1="425" x2="570" y2="425" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="100" y="442" text-anchor="middle" font-size="11" fill="#475569">乐器录制</text>
  <text x="300" y="442" text-anchor="middle" font-size="11" fill="#dc2626">❌ 不够</text>
  <text x="440" y="442" text-anchor="middle" font-size="11" fill="#16a34a">✅ 首选</text>
  <line x1="30" y1="455" x2="570" y2="455" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="100" y="472" text-anchor="middle" font-size="11" fill="#475569">户外采访</text>
  <text x="300" y="472" text-anchor="middle" font-size="11" fill="#16a34a">✅ 首选</text>
  <text x="440" y="472" text-anchor="middle" font-size="11" fill="#dc2626">❌ 怕风</text>

  <!-- Section 3: 三步选择 -->
  <text x="30" y="510" font-size="18" font-weight="700" fill="#1e293b"> 三步选择法</text>

  <!-- Step 1 -->
  <rect x="30" y="528" width="540" height="60" rx="10" fill="white" stroke="#a5d8ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="528" width="40" height="60" rx="10" fill="#3451b2"/>
  <rect x="50" y="528" width="20" height="60" fill="#3451b2"/>
  <text x="50" y="563" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text>
  <text x="90" y="555" font-size="14" font-weight="600" fill="#1e293b">环境：吵不吵？</text>
  <text x="90" y="575" font-size="11" fill="#64748b">吵 → 动圈（安全牌）  安静 → 动圈或电容都行</text>

  <!-- Step 2 -->
  <rect x="30" y="600" width="540" height="60" rx="10" fill="white" stroke="#b2f2bb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="600" width="40" height="60" rx="10" fill="#16a34a"/>
  <rect x="50" y="600" width="20" height="60" fill="#16a34a"/>
  <text x="50" y="635" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text>
  <text x="90" y="627" font-size="14" font-weight="600" fill="#1e293b">内容：录什么？</text>
  <text x="90" y="647" font-size="11" fill="#64748b">人声→动圈够用  乐器/播客→电容更佳</text>

  <!-- Step 3 -->
  <rect x="30" y="672" width="540" height="60" rx="10" fill="white" stroke="#ffd8a8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="672" width="40" height="60" rx="10" fill="#ea580c"/>
  <rect x="50" y="672" width="20" height="60" fill="#ea580c"/>
  <text x="50" y="707" text-anchor="middle" font-size="16" font-weight="700" fill="white">3</text>
  <text x="90" y="699" font-size="14" font-weight="600" fill="#1e293b">接口：USB还是XLR？</text>
  <text x="90" y="719" font-size="11" fill="#64748b">新手买USB（即插即用）  进阶选XLR（需配声卡）</text>

  <!-- Section 4: 推荐 -->
  <text x="30" y="770" font-size="18" font-weight="700" fill="#1e293b"> 🎯 新手推荐</text>

  <rect x="30" y="785" width="540" height="55" rx="10" fill="#3451b2" filter="url(#shadow)"/>
  <text x="300" y="808" text-anchor="middle" font-size="15" font-weight="700" fill="white">黄金组合：安静环境 + 电容USB + 防喷罩</text>
  <text x="300" y="828" text-anchor="middle" font-size="11" fill="#c7d2fe">进阶：动圈XLR + 声卡 = 抗噪专业方案</text>

  <!-- Footer -->
  <rect x="0" y="860" width="600" height="40" fill="#f1f5f9"/>
  <text x="300" y="883" text-anchor="middle" font-size="10" fill="#94a3b8">© 2026 Way · 音频算法工程师</text>
</svg>
