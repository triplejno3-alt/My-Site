<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background: transparent;">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e0"/>
      <stop offset="100%" stop-color="#ede3c8"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#8b6514"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="500" height="600" rx="20" fill="url(#bg1)"/>
  
  <!-- Decorative elements -->
  <circle cx="450" cy="80" r="120" fill="#6b4226" opacity="0.04"/>
  <circle cx="50" cy="520" r="100" fill="#8b6514" opacity="0.04"/>
  
  <!-- Quote mark -->
  <text x="40" y="90" font-size="72" font-weight="700" fill="url(#accent1)" opacity="0.3" font-family="Georgia, serif">"</text>
  
  <!-- Quote text -->
  <text x="40" y="130" font-size="18" fill="#3c2415" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" font-weight="500" letter-spacing="0.5">
    <tspan x="40" dy="0">在我一生的黄金时代，我有好多</tspan>
    <tspan x="40" dy="32">奢望。我想爱、想吃，还想在</tspan>
    <tspan x="40" dy="32">一瞬间变成天上半明半暗的云。</tspan>
    <tspan x="40" dy="32" fill="#8b7355" font-size="14">后来我才知道，生活就是个缓慢</tspan>
    <tspan x="40" dy="32" fill="#8b7355" font-size="14">受锤的过程，人一天天老下去，</tspan>
    <tspan x="40" dy="32" fill="#8b7355" font-size="14">奢望也一天天消失，最后变得像</tspan>
    <tspan x="40" dy="32" fill="#8b7355" font-size="14">挨了锤的牛一样。</tspan>
  </text>
  
  <!-- Author divider -->
  <line x1="40" y1="480" x2="180" y2="480" stroke="url(#accent1)" stroke-width="2"/>
  
  <!-- Author -->
  <text x="40" y="510" font-size="16" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif" font-weight="600">王小波</text>
  <text x="40" y="535" font-size="12" fill="#8b7355" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">——《黄金时代》</text>
  
  <!-- Category tag -->
  <rect x="340" y="545" width="120" height="28" rx="14" fill="#6b4226" opacity="0.15"/>
  <text x="400" y="564" text-anchor="middle" font-size="11" fill="#6b4226" font-family="'Noto Serif CJK SC', 'Playfair Display', serif">✦ 文学摘录</text>
</svg>
