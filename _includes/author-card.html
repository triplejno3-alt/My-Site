<div class="author-card">
  <div class="author-avatar">
    <img src="{{ author.avatar | relative_url }}" alt="{{ author.name }}" onerror="this.style.display='none'">
  </div>
  <div class="author-info">
    <div class="author-name">
      {{ author.short_name | default: author.name }}
      {% if author.role %}
        <span class="author-role">{{ author.role }}</span>
      {% endif %}
    </div>
    {% if author.bio %}
      <p class="author-bio">{{ author.bio }}</p>
    {% endif %}
    <div class="author-links">
      {% if author.email %}
        <a href="mailto:{{ author.email }}" title="邮箱" class="author-link">📧</a>
      {% endif %}
      {% if author.github %}
        <a href="https://github.com/{{ author.github }}" target="_blank" rel="noopener" title="GitHub" class="author-link">🐙</a>
      {% endif %}
      {% if author.url %}
        <a href="{{ author.url }}" target="_blank" rel="noopener" title="主页" class="author-link">🌐</a>
      {% endif %}
    </div>
  </div>
</div>

<style>
  .author-card {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    margin: 2rem 0 1.5rem 0;
    padding: 1.2rem 1.5rem;
    background: var(--bg-card, #f8f9fa);
    border-radius: 12px;
    border: 1px solid var(--border-color, #eee);
    transition: box-shadow 0.2s;
  }
  .author-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .author-avatar {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--primary, #2c3e50);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .author-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .author-info {
    flex: 1;
    min-width: 0;
  }
  .author-name {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--primary, #2c3e50);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .author-role {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--text-light, #888);
    background: var(--bg-tag, #eef0f2);
    padding: 2px 10px;
    border-radius: 12px;
  }
  .author-bio {
    margin: 0.3rem 0 0 0;
    font-size: 0.88rem;
    color: var(--text-light, #666);
    line-height: 1.4;
  }
  .author-links {
    margin-top: 0.3rem;
    display: flex;
    gap: 0.4rem;
  }
  .author-link {
    text-decoration: none;
    font-size: 0.85rem;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .author-link:hover {
    opacity: 1;
  }

  @media (max-width: 480px) {
    .author-card {
      flex-direction: column;
      text-align: center;
      gap: 0.8rem;
    }
    .author-name {
      justify-content: center;
    }
    .author-links {
      justify-content: center;
    }
  }
</style>
