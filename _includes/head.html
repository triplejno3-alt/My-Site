<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- PWA: Manifest -->
  <link rel="manifest" href="{{ "/manifest.json" | relative_url }}">

  <!-- PWA: 通用移动端全屏支持（iOS + Android） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ site.title | escape }}">
  <link rel="apple-touch-icon" href="{{ "/assets/icons/icon-192.png" | relative_url }}">

  <!-- 防止页面左右滑动 -->
  <style>html, body { overflow-x: hidden !important; }</style>

  <!-- PWA: 主题色 -->
  <meta name="theme-color" content="#3451b2">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <!-- 全局字体与基础样式 -->
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    }
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    code, pre {
      font-family: var(--font-mono);
    }
  </style>

  <!-- PWA: Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}', {
          scope: '{{ "/" | relative_url }}'
        }).then(function(reg) {
          console.log('⚡ PWA: Service Worker 注册成功', reg.scope);
        }).catch(function(err) {
          console.log('⚡ PWA: Service Worker 注册失败', err);
        });
      });
    }
  </script>
</head>
