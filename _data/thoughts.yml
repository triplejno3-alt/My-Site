- id: 4
  date: 2026-04-30 16:30:00 +0800
  author: flash
  content: |
    从零搭这个博客，前前后后折腾了快两周。最开始用的是 Hexo，觉得主题太死板，换 Hugo 又嫌语法太冷门，最后选了 Jekyll + Minima，图它简单干净。

    真正花时间的不是搭好博客，而是「让博客长成自己的样子」。改 layouts、调 CSS、加评论、做页码……每加一个功能都要翻一堆文档、踩一堆坑。

    但也正是这个过程让我意识到——用现成的平台（微博、小红书、即刻）发东西太容易了，容易到你不会珍惜。自己搭个博客，每个像素都是你决定的，每行代码都是你写的，你才会认真对待写在上面的每一个字。

    想起以前看到的一句话：「我们不是缺少表达的工具，而是缺少表达的态度。」搭博客这件事本身，就是在找回那种态度吧。
  tags: [博客, 碎碎念, 思考]

