- id: 6
  date: 2026-05-01 10:00:00 +0800
  author: flash
  content: |
    选了某个职业，是不是就一定会染上它的颜色？

    程序员待久了，看什么都想拆解成「if…then…」。走在路上看到红绿灯，脑子里自动跑了一遍逻辑：如果红灯且没车，那么闯——哦不对，不能闯。跟人聊天，对方说"这件事有点复杂"，你下意识接了一句"那得先定义清楚边界吧"。

    医生呢，吃饭前先洗手这个习惯大概会带进坟墓。朋友说"最近胃不舒服"，你第一反应不是"多喝热水"，而是"持续多久了？有没有伴随其他症状？"——然后意识到自己不是在坐诊。

    做设计的，看到路边的招牌配色丑了，比自己挨骂还难受。刷短视频看到模糊的截图，第一反应是"这分辨率不对"。

    可能不是职业改变了人，而是干一行久了，那套思维方式就长进肉里了。不是故意的，就是……化了。
  tags: [思考, 日常]
